patterns:
  - name: Box Breathing
    default_cycles: 10
    extended_exhale_interval: 3
    phases:
      - type: inhale
        seconds: 4
      - type: hold_in
        seconds: 4
      - type: exhale
        seconds: 4
      - type: hold_out
        seconds: 4

  - name: 4-7-8 Breathing
    default_cycles: 10
    phases:
      - type: inhale
        seconds: 4
      - type: hold_in
        seconds: 7
      - type: exhale
        seconds: 8

  - name: Test Deep-Exhale
    default_cycles: 10
    extended_exhale_interval: 1
    phases:
      - type: inhale
        seconds: 2
      - type: exhale
        seconds: 2

  - name: Coherent Breathing
    default_cycles: 10
    extended_exhale_interval: 5
    phases:
      - type: inhale
        seconds: 5
      - type: exhale
        seconds: 5
